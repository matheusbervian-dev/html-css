<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalhando com listas</h1>
    <h2>Listas Ordenadas</h2>
    <ol type="1">
        <li>Acordas</li>
        <li>Tomar café</li>
        <li>Escovar os dentes</li>
        <li>Lavar a roupa</li>
    </ol>
    <h2>Não Ordenadas</h2>
    <ul type="square">
        <li>PÃO 
        <li>CAFÉ
        <li>PRESUNTO
    </ul>
    <h2>Juntando listas 1.0</h2>
    <ol>
        <li>Antigas</li>
        <ol type="a">
            <li>Cliper</li>
            <li>Fortran</li>
            <li>Delphi</li>
        </ol>
        <li>Novas</li>
        <ol type="a">
            <li>php</li>
            <li>javascript</li>
        </ol>

    </ol>
</body>
</html>
